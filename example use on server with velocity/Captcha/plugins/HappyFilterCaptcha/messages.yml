# =====================================================
# HappyFilterCaptcha - messages.yml
# Поддержка цветов через & (ChatColor)
# Префикс: HappyFilter
# =====================================================

prefix: "&f[&bHappyFilter&f] "

# Шаги капчи (чат)
step1: "&bHappyFilter &8-> &fПройди капчу."
step2: "&bHappyFilter &8-> &fПереложи всю еду из сундука в шалкер."
step3: "&bHappyFilter &8-> &fВозьми кирку в руку и сломай шалкер."
step4: "&bHappyFilter &8-> &fБрось шалкер в воронку."

success: "&bHappyFilter &8-> &aВы успешно прошли капчу."

# Title при старте
title-main: "&bКапча"
title-sub: "&fПереложи еду в шалкер"

# ActionBar обратный отсчёт (переменная {time} = секунды)
actionbar-timer: "&eОсталось: &f{time} &eсек."

# Очередь
queue-wait: "&bHappyFilter &8-> &7Комната занята, ждите своей очереди... Позиция: &f{pos}"
queue-start: "&bHappyFilter &8-> &fВаша очередь!"

# Кик-причины (каждая ошибка = кик по умолчанию)
kick-NOT_ALL_FOOD: "&bHappyFilter &8-> &cВ шалкер переложена не вся еда."
kick-EXTRA_ITEM: "&bHappyFilter &8-> &cВ шалкере лишний предмет."
kick-NO_PICKAXE: "&bHappyFilter &8-> &cШалкер сломан без кирки в основной руке."
kick-WRONG_DROP: "&bHappyFilter &8-> &cВыброшен не тот предмет."
kick-WRONG_HOPPER_ITEM: "&bHappyFilter &8-> &cВ воронку брошен неверный предмет."
kick-WRONG_INVENTORY: "&bHappyFilter &8-> &cОткрыт запрещённый инвентарь."
kick-OUT_OF_BOUNDS: "&bHappyFilter &8-> &cВыход за границы платформы."
kick-TIMEOUT: "&bHappyFilter &8-> &cВремя вышло."

# Команды
cmd-reloaded: "&bHappyFilter &8-> &aКонфиги перезагружены."
cmd-no-perm: "&bHappyFilter &8-> &cНет прав."
cmd-usage: "&bHappyFilter &8-> &7Использование: /happycaptcha <reload|test|status> [player]"
cmd-player-only: "&bHappyFilter &8-> &cТолько для игроков."
cmd-player-not-found: "&bHappyFilter &8-> &cИгрок не найден."
cmd-not-in-captcha: "&bHappyFilter &8-> &7Игрок не проходит капчу."
cmd-status-active: "&bHappyFilter &8-> &7{player}: &aв капче &7(осталось {time} сек., очередь: {queue}, активен: {active})"
cmd-status-waiting: "&bHappyFilter &8-> &7{player}: &eв очереди &7(позиция {pos})"
cmd-test-start: "&bHappyFilter &8-> &7Капча принудительно запущена для {player}."
cmd-test-fail-bypass: "&bHappyFilter &8-> &cУ игрока bypass, капча не требуется."

# Запреты (сообщения в чат перед киком, если действие != KICK - иначе только кик)
# Сейчас по ТЗ сразу кик, сообщения ниже используются только если action != KICK
warn-chat-blocked: "&bHappyFilter &8-> &cЧат заблокирован до конца капчи."
warn-cmd-blocked: "&bHappyFilter &8-> &cКоманды заблокированы до конца капчи."
