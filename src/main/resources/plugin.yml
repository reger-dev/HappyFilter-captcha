name: HappyFilterCaptcha
version: 1.0.0
main: ru.happyfilter.captcha.HappyFilterCaptcha
api-version: 1.14
author: HappyFilter
description: Antibot captcha. Bukkit API only, 1.14-1.21.
commands:
  happycaptcha:
    description: Admin captcha control
    usage: /happycaptcha <reload|test|status> [player]
    aliases: [happyc, hfc]
permissions:
  happyfilter.admin:
    description: Admin access to /happycaptcha
    default: op
  happyfilter.bypass:
    description: Bypass captcha check
    default: op
